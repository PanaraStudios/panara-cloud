[package]
name = "panara-cloud-web"
version = "0.1.9"
edition = "2024"
license = "MIT"
publish = false
description = "Serves the Panara Cloud web app's static files and proxies its /api routes to Convex"

[features]
default = ["tls"]
# HTTPS to Convex (a Convex Cloud site URL); installs reach Convex over plain
# HTTP on their own network.
tls = ["dep:hyper-rustls"]

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-rustls = { version = "0.27", optional = true, default-features = false, features = ["http1", "ring", "tls12", "webpki-roots"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server", "server-graceful", "tokio"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "signal", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
