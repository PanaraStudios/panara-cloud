name: Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm format-and-lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Backend and agent tests
        run: pnpm test
      - name: Web build
        run: pnpm --filter @panara-cloud/web build
        env:
          CONVEX_INTERNAL_URL: http://localhost:3210
          CONVEX_INTERNAL_SITE_URL: http://localhost:3211
          CONVEX_PUBLIC_URL: http://localhost:3210
