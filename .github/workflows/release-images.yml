name: Release images

# Builds multi-arch (amd64 + arm64) images for the web app, the agent, the
# monitoring collector, the functions deploy and the Convex backend
# (deploy/convex/Dockerfile, the upstream binary repackaged) and pushes them as
# <registry>/<owner>/panara-cloud-{web,agent,monitoring,migrate,convex}.
#   tag v1.2.3      -> :1.2.3 and :latest (the installer and the panel's
#                      update check pick the newest x.y.z tag)
#   manual dispatch -> :<channel> (e.g. canary), version label <x.y.z>-<channel>.<sha>
#
# The migrate image (apps/agent/Dockerfile, target migrate) is built in the
# agent's job, with the same builder, so the Debian and Node layers the two
# share are the same blobs and a host downloads and stores them once. It is
# also tagged with its version label on channel builds: installers and
# updates pick the migrate image by the agent image's version label.
#
# x.y.z is the "version" of the root package.json, the one place a release
# bumps (scripts/check-version.mjs keeps the workspace package.json files and
# CHANGELOG.md in step with it). A tag that is not that version fails here.
#
# Registry and owner are repository variables: IMAGE_REGISTRY (default
# ghcr.io) and IMAGE_OWNER (default the repository owner). Pushing to GHCR
# uses GITHUB_TOKEN; other registries need REGISTRY_USERNAME and
# REGISTRY_PASSWORD secrets.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      channel:
        description: Moving tag to publish (e.g. canary)
        required: true
        default: canary

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}
  OWNER: ${{ vars.IMAGE_OWNER || github.repository_owner }}

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      prefix: ${{ steps.meta.outputs.prefix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: meta
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "prefix=$REGISTRY/$owner/panara-cloud" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Tag must be vX.Y.Z" >&2; exit 1; }
            node scripts/check-version.mjs "$GITHUB_REF_NAME"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tags=$version,latest" >> "$GITHUB_OUTPUT"
          else
            echo "$CHANNEL" | grep -Eq '^[a-z][a-z0-9-]{0,30}$' || { echo "Invalid channel" >&2; exit 1; }
            node scripts/check-version.mjs
            base=$(node scripts/check-version.mjs --print)
            echo "version=$base-$CHANNEL.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "tags=$CHANNEL" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: meta
    strategy:
      fail-fast: true
      matrix:
        image: [web, agent, monitoring, convex]
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - id: migrate
        if: matrix.image == 'agent'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/agent/Dockerfile
          target: migrate
          platforms: linux/${{ matrix.platform.arch }}
          build-args: PANARA_CLOUD_VERSION=${{ needs.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
          outputs: type=image,name=${{ needs.meta.outputs.prefix }}-migrate,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=agent-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=migrate-${{ matrix.platform.arch }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image == 'convex' && 'deploy/convex' || '.' }}
          file: ${{ matrix.image == 'convex' && 'deploy/convex/Dockerfile' || format('apps/{0}/Dockerfile', matrix.image) }}
          platforms: linux/${{ matrix.platform.arch }}
          build-args: |
            PANARA_CLOUD_VERSION=${{ needs.meta.outputs.version }}
            PANARA_CLOUD_MIGRATE_IMAGE=${{ needs.meta.outputs.prefix }}-migrate
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
          outputs: type=image,name=${{ needs.meta.outputs.prefix }}-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=gha,scope=${{ matrix.image }}-${{ matrix.platform.arch }}
            type=gha,scope=migrate-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform.arch }}
      - name: Export digests
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.migrate.outputs.digest }}
        run: |
          mkdir -p /tmp/digests /tmp/migrate-digests
          touch "/tmp/digests/${DIGEST#sha256:}"
          if [ -n "$MIGRATE_DIGEST" ]; then touch "/tmp/migrate-digests/${MIGRATE_DIGEST#sha256:}"; fi
      - uses: actions/upload-artifact@v5
        with:
          name: digest-${{ matrix.image }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          retention-days: 1
      - if: matrix.image == 'agent'
        uses: actions/upload-artifact@v5
        with:
          name: digest-migrate-${{ matrix.platform.arch }}
          path: /tmp/migrate-digests/*
          retention-days: 1

  manifest:
    needs: [meta, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [web, agent, monitoring, migrate, convex]
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: digest-${{ matrix.image }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifests
        env:
          IMAGE: ${{ needs.meta.outputs.prefix }}-${{ matrix.image }}
          TAGS: ${{ needs.meta.outputs.tags }}
          VERSION: ${{ needs.meta.outputs.version }}
          NAME: ${{ matrix.image }}
        working-directory: /tmp/digests
        run: |
          set --
          for tag in $(echo "$TAGS" | tr ',' ' '); do set -- "$@" -t "$IMAGE:$tag"; done
          if [ "$NAME" = migrate ] && ! echo ",$TAGS," | grep -q ",$VERSION,"; then set -- "$@" -t "$IMAGE:$VERSION"; fi
          docker buildx imagetools create "$@" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$(echo "$TAGS" | cut -d, -f1)"
